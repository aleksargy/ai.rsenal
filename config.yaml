# ai.rsenal policy.
#
# Policy lives here, in version control, so a bad run is traceable to the setting
# that caused it. Secrets live in the environment — see .env.example.

optimiser:
  # Gameweeks to plan over. Beyond ~5 the forecast is too noisy to be worth
  # solving, and plans rarely survive that long intact anyway.
  horizon: 5

  # Per-gameweek discount on future expected points. Near-term xP is more
  # reliable, so weight it accordingly.
  discount: 0.85

  # kappa in `xP - kappa * sigma`. Without this the solver chases volatile
  # players' upper tails and builds a squad that looks great and swings wildly.
  risk_aversion: 0.2

  # Small bonus for bench quality, so the bench is not filled with GBP 4.0m
  # players who never appear. Keep it small — bench points are secondary
  # outside a Bench Boost.
  bench_weight: 0.1

  # Most points to spend on transfers in one gameweek. 4 permits a single hit;
  # 0 disables hits entirely. Exceeding this degrades to advisory rather than
  # submitting.
  max_hit: 4

  # Expected points a hit must clear BEYOND breaking even before it is taken.
  #
  # The -4 is certain; the gain justifying it is a forecast with a wide error
  # bar. At 0, every transfer estimated to gain 4.1 points gets taken — and
  # roughly half of those are really worth less than 4. It also prices plan
  # decay: a gain accumulated over five gameweeks assumes the player stays fit,
  # keeps starting, and is not repriced.
  #
  # Raise it to make the agent more conservative about hits; set 0 to optimise
  # on raw expected value.
  hit_margin: 3.0

  # Seconds. A timeout is a failed stage that retries on a shorter horizon,
  # never a result to be trusted.
  solver_time_limit: 60

research:
  # Candidates researched beyond the owned 15. Researching all 662 players is
  # wasteful; this covers everyone realistically reachable.
  shortlist_size: 60

  # Availability claims older than this are discarded, not downweighted. A
  # Tuesday injury report is superseded by Friday's press conference.
  max_evidence_age_days: 10

  # Below this many working source adapters, abort rather than forecast on thin
  # evidence.
  min_sources: 2

  # How far down the source tiers a claim may still change a number.
  #   3 = official data, measured stats, and reported claims only
  #   4 = also lets FPL creator and community opinion count (default)
  #
  # Tier 4 is weighted by what the claim asserts, not flatly. An FPL analyst's
  # JUDGEMENT about rotation risk or a role change counts for much more than the
  # same person relaying a FACT the club already announced - because on the
  # former they are the specialist, and on the latter they are downstream.
  #
  # Narrower than it sounds: a creator who ATTRIBUTES a claim to a press
  # conference is already promoted to Tier 3 and counts either way. Only pure
  # opinion is gated.
  #
  # The default is a starting position, not a verdict - we hold no track record
  # for any individual source, so "expert" is an assertion until measured. Set
  # it to 4, re-run `arsenal backtest`, and let the numbers decide.
  max_tier_that_moves_forecast: 4

  # HTTP(S) proxy for YouTube transcript requests, e.g.
  #   transcript_proxy: http://user:pass@proxy.example.com:8080
  #
  # YouTube rate-limits transcript scraping per IP and blocks cloud-provider
  # ranges outright. The block is not client-specific, so a different IP is the
  # only durable fix. Leave unset to fetch directly - fine from a home
  # connection, as long as the cache is warm and requests stay paced.
  # transcript_proxy:

  # Which provider extracts claims: auto | anthropic | gemini
  #   auto     prefers Anthropic for quality, falls back to Gemini
  #   gemini   Google AI Studio has a genuinely free tier whose rate limits
  #            comfortably fit a run of ~60 documents
  provider: auto

  # Model id. Leave blank to use the provider default (claude-opus-5 or
  # gemini-2.5-flash).
  # model:

  # Model used to extract claims from press conferences and community posts.
  # A full research run is ~51k input / ~18k output tokens, so roughly:
  #   claude-opus-5     $0.71 per run   (~$107 a season at 4 runs per gameweek)
  #   claude-sonnet-5   $0.28 per run   (~$43 a season)
  #   claude-haiku-4-5  $0.14 per run   (~$21 a season)
  # Extraction quality sets P(plays), which dominates the forecast — hence the
  # capable default. Downgrade if the cost matters more than the last few points.
  subreddits:
    - FantasyPL

  # YouTube channel ids to pull transcripts from. Find more with
  # `arsenal channels "<name>"`.
  #
  # Tier 4, but weighted by what the claim asserts: a specialist's JUDGEMENT
  # about rotation risk or a role change carries real weight, because that is
  # their expertise. The same person relaying a FACT the club already announced
  # does not, because there they are simply downstream of the announcement.
  youtube_channels:
    - UCxeOc7eFxq37yW_Nc-69deA  # Let's Talk FPL
    - UCcPWnCj5AKC19HaySZjb25g  # FPL Harry
    - UCweDAlFm2LnVcOqaFU4_AGA  # FPL Mate
    - UCKxYKQ8pgJ7V8wwh4hLsSXQ  # Fantasy Football Scout
    - UC72QokPHXQ9r98ROfNZmaDw  # FPL Focal
    - UC8043oOKTB4uP8Nq15Kz6bg  # Planet FPL

schedule:
  # All relative to the gameweek deadline, never a fixed clock time — deadlines
  # move for midweek and holiday rounds.
  research_hours_before: 72
  provisional_hours_before: 24
  final_research_hours_before: 3
  submit_minutes_before: 90
  verify_minutes_before: 30

  # Refuse to submit inside this margin. Too little room to recover if the
  # write fails, and a failed late write is worse than an unchanged team.
  abort_if_under_minutes: 10

autonomy:
  # False puts the whole system in advisory mode regardless of session health.
  enabled: true

  # Whether chips fire without approval.
  auto_chips: true

  # A Wildcard rewrites the entire squad. That is worth a human glance.
  require_approval_for_wildcard: true

  # Print payloads instead of sending them. LEAVE THIS TRUE until you have
  # diffed `arsenal execute --dry-run` against a real browser submission — the
  # write payload shapes are reconstructed, not independently verified.
  dry_run: true
