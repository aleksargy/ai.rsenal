[project]
name = "arsenal"
version = "0.1.0"
description = "Autonomous Fantasy Premier League manager — LLM research, integer-program squad selection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pulp>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
agents = ["anthropic>=0.40"]
# Gemini needs no SDK - it is reached over REST with the httpx already here.
youtube = ["youtube-transcript-api>=1.0"]
browser = ["playwright>=1.49"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13", "respx>=0.22"]

[project.scripts]
arsenal = "arsenal.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arsenal"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/RUF003: the CLI deliberately prints a typographic minus ("T−72h") and
# middot separators. They are display strings, not identifiers.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/arsenal"]
